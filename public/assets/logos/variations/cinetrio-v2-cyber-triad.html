<!DOCTYPE html><html><body style="margin:0;padding:0;overflow:hidden;background:#060608;"><svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

          <stop offset="100%" stop-color="#0066ff"/>
