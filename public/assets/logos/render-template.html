<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07070a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px;
      font-family: 'Inter', sans-serif;
    }
    .logo-card {
      width: 1200px;
      height: 380px;
      background: radial-gradient(circle at 50% 50%, #151520, #09090d 85%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
    }
    .logo-square {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle at 50% 40%, #171722, #07070a 90%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <!-- Concept 1: Prismatic Delta -->
  <div id="c1" class="logo-card">
    <svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="c1-red" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff3355"/>
          <stop offset="100%" stop-color="#990022"/>
        </linearGradient>
        <linearGradient id="c1-violet" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#581c87"/>
        </linearGradient>
        <linearGradient id="c1-teal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#10b981"/>
          <stop offset="100%" stop-color="#064e3b"/>
        </linearGradient>
        <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="14" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      <!-- Glowing Prism Emblem -->
      <g transform="translate(60, 30)" filter="url(#c1-glow)">
        <polygon points="90,10 170,150 90,105" fill="url(#c1-red)" opacity="0.95"/>
        <polygon points="90,105 170,150 10,150" fill="url(#c1-violet)" opacity="0.9"/>
        <polygon points="90,10 90,105 10,150" fill="url(#c1-teal)" opacity="0.88"/>
        <!-- Inner glass core -->
        <polygon points="90,55 125,120 55,120" fill="#ffffff" opacity="0.25"/>
        <!-- Centered Play Mark -->
        <polygon points="82,75 106,88 82,101" fill="#ffffff"/>
      </g>
      <!-- Typography -->
      <g transform="translate(290, 65)">
        <text x="0" y="70" font-family="'Inter', sans-serif" font-size="80" font-weight="900" letter-spacing="4" fill="#ffffff">
          CINE<tspan fill="#ff3355">TRIO</tspan>
        </text>
        <text x="5" y="112" font-family="'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="10" fill="#94a3b8">
          STUDIOS • AI • MEDIA • COMMERCE
        </text>
      </g>
    </svg>
  </div>

  <!-- Concept 2: Streaming Ribbon C -->
  <div id="c2" class="logo-card">
    <svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="c2-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff1a3c"/>
          <stop offset="50%" stop-color="#e50914"/>
          <stop offset="100%" stop-color="#7a000b"/>
        </linearGradient>
        <linearGradient id="c2-grad2" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#e50914"/>
          <stop offset="100%" stop-color="#ff4d6d"/>
        </linearGradient>
        <filter id="c2-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#e50914" flood-opacity="0.5"/>
        </filter>
      </defs>
      <!-- Ribbon 'C' Emblem -->
      <g transform="translate(65, 30)" filter="url(#c2-glow)">
        <path d="M130 20 C 60 20, 20 60, 20 100 C 20 140, 60 180, 130 180 C 150 180, 162 172, 168 162 L 140 142 C 132 148, 122 152, 112 152 C 72 152, 54 125, 54 100 C 54 75, 72 48, 112 48 C 125 48, 138 52, 144 58 L 168 38 C 160 28, 145 20, 130 20 Z" fill="url(#c2-grad1)"/>
        <!-- 3 Dynamic Speed Lines / Layers inside the ribbon -->
        <path d="M42 70 L 78 54" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
        <path d="M28 100 L 68 100" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
        <path d="M42 130 L 78 146" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      </g>
      <!-- Typography -->
      <g transform="translate(290, 65)">
        <text x="0" y="70" font-family="'Bebas Neue', 'Inter', sans-serif" font-size="94" font-weight="800" letter-spacing="8" fill="#f8fafc">
          CINETRIO
        </text>
        <text x="6" y="110" font-family="'Inter', sans-serif" font-size="15" font-weight="800" letter-spacing="12" fill="#e50914">
          THE CREATIVE AGENCY
        </text>
      </g>
    </svg>
  </div>

  <!-- Concept 3: Camera Tri-Aperture -->
  <div id="c3" class="logo-card">
    <svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="c3-lens" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff3355"/>
          <stop offset="100%" stop-color="#e50914"/>
        </linearGradient>
        <radialGradient id="c3-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff3355" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#ff3355" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- Camera Aperture Shutter Blade with 3 blades -->
      <g transform="translate(150, 120)">
        <circle cx="0" cy="0" r="70" fill="none" stroke="#252536" stroke-width="5"/>
        <circle cx="0" cy="0" r="50" fill="url(#c3-glow)"/>
        <!-- 3 Curved Blades -->
        <path d="M-15 -55 Q 40 -48, 30 0 Q 22 40, -32 30 Z" fill="#e50914" opacity="0.95"/>
        <path d="M42 -12 Q 45 38, 0 38 Q -38 30, -22 -28 Z" fill="#8b5cf6" opacity="0.9" transform="rotate(120)"/>
        <path d="M-28 30 Q -45 -15, 0 -35 Q 35 -22, 18 38 Z" fill="#10b981" opacity="0.9" transform="rotate(240)"/>
        <circle cx="0" cy="0" r="14" fill="#ffffff"/>
      </g>
      <!-- Typography -->
      <g transform="translate(290, 65)">
        <text x="0" y="70" font-family="'Inter', sans-serif" font-size="78" font-weight="900" letter-spacing="4" fill="#ffffff">
          CINE<tspan fill="#e50914">TRIO</tspan>
        </text>
        <text x="5" y="112" font-family="'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="8" fill="#94a3b8">
          DIGITAL PRODUCTION &amp; TECH
        </text>
      </g>
    </svg>
  </div>

  <!-- Concept 4: Modern Minimalist Tri-Bar -->
  <div id="c4" class="logo-card">
    <svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="c4-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ff3355"/>
          <stop offset="100%" stop-color="#e50914"/>
        </linearGradient>
      </defs>
      <!-- 3 Anamorphic Light Bars -->
      <g transform="translate(100, 55)">
        <rect x="0" y="30" width="16" height="70" rx="8" fill="url(#c4-grad)"/>
        <rect x="36" y="5" width="16" height="120" rx="8" fill="#ffffff"/>
        <rect x="72" y="30" width="16" height="70" rx="8" fill="url(#c4-grad)"/>
        <!-- Glowing horizontal anamorphic laser beam -->
        <rect x="-16" y="60" width="120" height="8" rx="4" fill="#ff3355" opacity="0.85"/>
      </g>
      <!-- Typography -->
      <g transform="translate(290, 65)">
        <text x="0" y="70" font-family="'Inter', sans-serif" font-size="82" font-weight="900" letter-spacing="6" fill="#ffffff">
          CINETRIO
        </text>
        <text x="6" y="112" font-family="'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="10" fill="#64748b">
          NEXT-GEN MEDIA &amp; AI
        </text>
      </g>
    </svg>
  </div>

  <!-- Square Icon for Profile / App Avatar -->
  <div id="c1-square" class="logo-square">
    <svg width="450" height="450" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sq-red" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff3355"/>
          <stop offset="100%" stop-color="#990022"/>
        </linearGradient>
        <linearGradient id="sq-violet" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#581c87"/>
        </linearGradient>
        <linearGradient id="sq-teal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#10b981"/>
          <stop offset="100%" stop-color="#064e3b"/>
        </linearGradient>
        <filter id="sq-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="16" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      <!-- Prism Emblem -->
      <g transform="translate(40, 25)" filter="url(#sq-glow)">
        <polygon points="110,15 210,185 110,130" fill="url(#sq-red)" opacity="0.95"/>
        <polygon points="110,130 210,185 10,185" fill="url(#sq-violet)" opacity="0.9"/>
        <polygon points="110,15 110,130 10,185" fill="url(#sq-teal)" opacity="0.88"/>
        <polygon points="110,70 152,150 68,150" fill="#ffffff" opacity="0.25"/>
        <polygon points="100,95 130,112 100,128" fill="#ffffff"/>
      </g>
      <text x="150" y="255" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#ffffff">
        CINE<tspan fill="#ff3355">TRIO</tspan>
      </text>
    </svg>
  </div>

</body>
</html>
